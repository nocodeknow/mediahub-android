name: Mediahub Android Build

on:
  push:
    branches:
      - mediahub
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mediahub-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and Build fullDebug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;37.0.0"

      - name: Prepare runtime properties
        run: |
          touch local.properties

      - name: Run targeted tests
        run: ./gradlew :composeApp:testAndroidHostTest --tests "com.nuvio.app.features.trakt.*" -Dorg.gradle.jvmargs="-Xmx3584M -XX:MaxMetaspaceSize=1024M" --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process --stacktrace

      - name: Build fullDebug APK
        run: ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore -Dorg.gradle.jvmargs="-Xmx3584M -XX:MaxMetaspaceSize=1024M" --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process --stacktrace

      - name: Upload fullDebug APK
        uses: actions/upload-artifact@v7
        with:
          name: mediahub-full-debug-apk
          path: androidApp/build/outputs/apk/full/debug/*.apk
          archive: false
          if-no-files-found: error
          retention-days: 7
